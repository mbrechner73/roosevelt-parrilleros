<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pago de prueba · Parrilleros</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>main{max-width:460px;margin:0 auto;padding:40px 16px;display:grid;gap:16px}</style>
</head>
<body>
<main>
  <h1>Pago de prueba</h1>
  <div class="card">
    <p class="note" style="color:var(--ember)">Modo demostración: no se cobra nada. Cuando se configure Mercado Pago, en lugar de esta página se abre el checkout real.</p>
    <div id="sum"></div>
    <div class="btns"><button id="no">No pagar</button><button class="primary" id="si">Simular pago aprobado</button></div>
    <p class="msg" id="m"></p>
  </div>
</main>
<script>
{
const $ = (id) => document.getElementById(id), id = new URLSearchParams(location.search).get('r');
const post = (b) => fetch('/api/pago-demo/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then((r) => r.json().then((j) => { if (!r.ok) throw new Error(j.error); return j; }));
fetch('/api/pago-demo/' + id).then((r) => r.json()).then((j) => {
  if (!j.reserva) { $('m').textContent = j.error || 'Reserva no encontrada'; return; }
  const r = j.reserva;
  $('sum').innerHTML = `<div class="dl"><span>Parrillero</span><strong>${r.parrillero}</strong></div><div class="dl"><span>Fecha</span><strong>${r.fecha}, ${j.turno.h}</strong></div><div class="dl"><span>Apartamento</span><strong>${r.apto}</strong></div><div class="dl"><span>Seña</span><strong>$ ${r.monto}</strong></div>`;
});
$('si').onclick = () => post({ aprobar: true }).then(() => (location.href = '/?pago=ok')).catch((e) => { $('m').textContent = e.message; $('m').className = 'msg err'; });
$('no').onclick = () => post({ aprobar: false }).finally(() => (location.href = '/?pago=error'));
}
</script>
</body>
</html>
